services:
  # ۱. سرویس دیتابیس صنعتی گراف Neo4j به همراه پلاگین GDS
  neo4j-gds:
    image: neo4j:5.15.0-enterprise
    container_name: neo4j_gds_container
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - predictive-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ۲. سرویس اصلی پایتون
  predictive-maintenance-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: prdctv_mtn_grp_neo_ai:v1
    container_name: prdctv_mtn_grp_neo_container
    ports:
      - "8008:8008"
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j-gds:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - GRAPHITI_API_URL=http://predictive-maintenance-ai:8008
    depends_on:
      neo4j-gds:
        condition: service_healthy
    networks:
      - predictive-net
    restart: unless-stopped

networks:
  predictive-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs: