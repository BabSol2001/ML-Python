    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "High_Infeed_Rate", "label": "High_Infeed_Rate", "shape": "ellipse", "title": "Node: High_Infeed_Rate"}, {"color": "#97c2fc", "id": "Grinding_Temp", "label": "Grinding_Temp", "shape": "ellipse", "title": "Node: Grinding_Temp"}, {"color": "#97c2fc", "id": "Thermal_Burn", "label": "Thermal_Burn", "shape": "ellipse", "title": "Node: Thermal_Burn"}, {"color": "#97c2fc", "id": "Fatigue_Life", "label": "Fatigue_Life", "shape": "ellipse", "title": "Node: Fatigue_Life"}, {"color": "#ffa64d", "id": "Ti-6Al-4V", "label": "Ti-6Al-4V", "shape": "ellipse", "title": "\u003cb\u003eAFFECTED NODE\u003c/b\u003e\u003cbr\u003eTi-6Al-4V"}, {"color": "#ffa64d", "id": "Turbine_Blade", "label": "Turbine_Blade", "shape": "ellipse", "title": "\u003cb\u003eAFFECTED NODE\u003c/b\u003e\u003cbr\u003eTurbine_Blade"}, {"color": "#ffa64d", "id": "High_Precision_Grinding", "label": "High_Precision_Grinding", "shape": "ellipse", "title": "\u003cb\u003eAFFECTED NODE\u003c/b\u003e\u003cbr\u003eHigh_Precision_Grinding"}, {"color": "#ff4d4d", "id": "Supplier_Alpha", "label": "Supplier_Alpha", "shape": "ellipse", "title": "\u003cb\u003eCRITICAL RISK SOURCE\u003c/b\u003e\u003cbr\u003eSupplier_Alpha"}, {"color": "#97c2fc", "id": "Customer_Boeing", "label": "Customer_Boeing", "shape": "ellipse", "title": "Node: Customer_Boeing"}, {"color": "#ffa64d", "id": "Region_Risk_Zone", "label": "Region_Risk_Zone", "shape": "ellipse", "title": "\u003cb\u003eAFFECTED NODE\u003c/b\u003e\u003cbr\u003eRegion_Risk_Zone"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "gray", "from": "High_Infeed_Rate", "label": "Increases", "title": "Increases", "to": "Grinding_Temp"}, {"arrows": "to", "color": "gray", "from": "Grinding_Temp", "label": "Causes", "title": "Causes", "to": "Thermal_Burn"}, {"arrows": "to", "color": "gray", "from": "Thermal_Burn", "label": "Reduces", "title": "Reduces", "to": "Fatigue_Life"}, {"arrows": "to", "color": "gray", "from": "Ti-6Al-4V", "label": "Used_In", "title": "Used_In", "to": "Turbine_Blade"}, {"arrows": "to", "color": "gray", "from": "Turbine_Blade", "label": "Requires_Process", "title": "Requires_Process", "to": "High_Precision_Grinding"}, {"arrows": "to", "color": "gray", "from": "Supplier_Alpha", "label": "Supplies", "title": "Supplies", "to": "Ti-6Al-4V"}, {"arrows": "to", "color": "gray", "from": "Supplier_Alpha", "label": "Located_In", "title": "Located_In", "to": "Region_Risk_Zone"}, {"arrows": "to", "color": "gray", "from": "Customer_Boeing", "label": "Orders", "title": "Orders", "to": "Turbine_Blade"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
