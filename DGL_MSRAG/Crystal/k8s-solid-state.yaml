apiVersion: apps/v1
kind: Deployment
metadata:
  name: solid-state-deployment
  labels:
    app: solid-state-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solid-state-ai
  template:
    metadata:
      labels:
        app: solid-state-ai
    spec:
      containers:
      - name: solid-state-container
        image: solid_state_ai:v1
        imagePullPolicy: IfNotPresent  # تغییر از Never به IfNotPresent
        ports:
        - containerPort: 8000   # پورت داخل کانتینر (مطابق Dockerfile)
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: solid-state-service
spec:
  type: LoadBalancer
  ports:
  - port: 8003        # پورتی که روی سیستم خودتان باز می‌شود
    targetPort: 8000  # پورتی که ترافیک به آن در کانتینر هدایت می‌شود
  selector:
    app: solid-state-ai